<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 글로닉스 이민법인</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<style>
  :root { --c:#43809E; --seal:#C6A968; --ink:#12171A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(162deg,#0E1215,#171D21 60%,#212930); color:#EDF0F1; padding:24px;
    word-break:keep-all; line-height:1.72; }
  main { max-width:520px; }
  .code { display:flex; align-items:center; gap:14px; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.75rem; font-weight:500; letter-spacing:.11em; color:var(--seal); margin-bottom:20px; }
  .code::before { content:""; width:24px; height:1px; background:currentColor; }
  h1 { font-family:"Noto Serif KR",serif; font-weight:600; letter-spacing:-.018em;
    font-size:clamp(1.6rem,4vw,2.4rem); line-height:1.28; margin:0 0 14px; }
  p { color:#99A4A9; margin:0 0 30px; }
  a.btn { display:inline-block; background:var(--c); border:1px solid var(--c); color:#fff; text-decoration:none;
    font-weight:600; padding:15px 28px; border-radius:3px; transition:background .2s, border-color .2s; }
  a.btn:hover { background:#2F6580; border-color:#2F6580; }
  a.btn:focus-visible { outline:2px solid #7FB2CC; outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <p class="code">HTTP 404 — NOT FOUND</p>
    <h1>요청하신 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다. 홈에서 서비스와 상담 신청을 다시 찾아보세요.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
